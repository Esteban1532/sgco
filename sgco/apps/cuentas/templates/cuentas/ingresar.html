{% extends 'base.html' %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="login">
  <div class="text-center mb-4">
    <div class="display-6 fw-bold" style="color:#1f4e79">SGCO</div>
    <div class="text-muted">Sistema de Gestión del Consultorio Odontológico</div>
  </div>
  <form method="post" class="tarjeta">
    {% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
    <div class="mb-3">
      <label class="form-label" for="id_username">Usuario</label>
      <input class="form-control" type="text" name="username" id="id_username" autofocus required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="id_password">Contraseña</label>
      <input class="form-control" type="password" name="password" id="id_password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-sgco w-100">Ingresar</button>
  </form>
</div>
{% endblock %}
